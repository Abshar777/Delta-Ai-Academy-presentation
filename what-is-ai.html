<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What Is Ai ??</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#161616;
    --white:#f5f5f5;
    --gray:#cfcfcf;
    --amber:#e8a33c;
    --select:#2f9bf5;     /* design-tool selection blue */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    background:var(--bg);
    font-family:"Fredoka", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
    padding:6vw;
    cursor:default;
  }

  .stage{
    width:100%;
    max-width:1000px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:clamp(18px, 2.6vh, 34px);
  }

  /* Each editable element + its selection box */
  .field{
    position:relative;
    display:inline-block;
    max-width:100%;
  }
  .field .box{
    position:absolute;
    inset:-10px -14px;
    border:1.5px solid var(--select);
    border-radius:3px;
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
  }
  .field.selected .box{ opacity:1; }

  /* corner handles for the design-tool feel */
  .box::before,.box::after,
  .handle{
    content:"";
    position:absolute;
    width:7px; height:7px;
    background:#fff;
    border:1.5px solid var(--select);
    border-radius:1px;
  }
  .box::before{ top:-4px; left:-4px; }
  .box::after{ bottom:-4px; right:-4px; }
  .handle.tr{ top:-4px; right:-4px; }
  .handle.bl{ bottom:-4px; left:-4px; }

  .text{
    display:inline;
    white-space:pre-wrap;
    word-break:break-word;
  }

  /* blinking caret */
  .caret{
    display:inline-block;
    width:2px;
    height:1em;
    background:var(--select);
    margin-left:1px;
    transform:translateY(0.14em);
    animation:blink 1s steps(1) infinite;
  }
  .field:not(.typing) .caret{ display:none; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* Title */
  .title{
    font-size:clamp(2.4rem, 6vw, 4.4rem);
    font-weight:500;
    letter-spacing:.5px;
    line-height:1.15;
  }
  .title .amber{ color:var(--amber); }

  /* Paragraph */
  .desc{
    font-size:clamp(1.1rem, 2.3vw, 1.9rem);
    font-weight:300;
    line-height:1.5;
    color:var(--gray);
    max-width:920px;
  }

  /* restart hint */
  .hint{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    font-size:.85rem;
    color:#666;
    font-weight:300;
    opacity:0;
    transition:opacity .6s ease;
    letter-spacing:.4px;
  }
  .hint.show{ opacity:1; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="field title" id="f-title">
      <span class="box"><i class="handle tr"></i><i class="handle bl"></i></span>
      <span class="text" id="t-title"></span><span class="caret"></span>
    </div>

    <div class="field desc" id="f-desc">
      <span class="box"><i class="handle tr"></i><i class="handle bl"></i></span>
      <span class="text" id="t-desc"></span><span class="caret"></span>
    </div>
  </div>

  <div class="hint" id="hint">click anywhere to replay</div>

<script>
  // ---- content ----
  const TITLE = [
    { t: "What Is " },
    { t: "Ai", cls: "amber" },
    { t: " ??" }
  ];
  const DESC = [
    { t: "ArtificialIntelligence (AI) is software that understands plain-language instructions and produces useful results writing, images, code, decisions, and more. You don't need to know how to code. You just need to know what to ask for." }
  ];

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function html(seg){
    return seg.cls ? `<span class="${seg.cls}">${esc(seg.t)}</span>` : esc(seg.t);
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Type a list of segments into a target, char by char, keeping colors.
  async function typeInto(fieldEl, targetEl, segments, { speed=58, jitter=42 } = {}){
    fieldEl.classList.add('selected','typing');
    targetEl.innerHTML = '';
    let built = [];               // already-finished segments as html
    for (const seg of segments){
      let typed = '';
      for (const ch of seg.t){
        typed += ch;
        const partial = seg.cls ? `<span class="${seg.cls}">${esc(typed)}</span>` : esc(typed);
        targetEl.innerHTML = built.join('') + partial;
        // natural pauses after spaces / punctuation
        let d = speed + Math.random()*jitter;
        if (/[.,?]/.test(ch)) d += 220;
        else if (ch === ' ') d += 50;
        await sleep(d);
      }
      built.push(html(seg));
    }
    fieldEl.classList.remove('typing');   // hide caret
  }

  async function deselect(fieldEl, hold=520){
    await sleep(hold);
    fieldEl.classList.remove('selected');
  }

  async function run(){
    const stage = document.getElementById('stage');
    const fTitle = document.getElementById('f-title');
    const fDesc  = document.getElementById('f-desc');
    const tTitle = document.getElementById('t-title');
    const tDesc  = document.getElementById('t-desc');
    const hint   = document.getElementById('hint');

    // reset
    [fTitle,fDesc].forEach(f=>f.classList.remove('selected','typing'));
    tTitle.innerHTML=''; tDesc.innerHTML='';
    hint.classList.remove('show');

    await sleep(700);
    // 1) title
    await typeInto(fTitle, tTitle, TITLE, { speed:90, jitter:70 });
    await deselect(fTitle, 650);

    await sleep(350);
    // 2) paragraph
    await typeInto(fDesc, tDesc, DESC, { speed:26, jitter:34 });
    await deselect(fDesc, 700);

    hint.classList.add('show');
  }

  let running = false;
  async function start(){
    if (running) return;
    running = true;
    await run();
    running = false;
  }

  document.body.addEventListener('click', ()=>{ if(!running) start(); });
  window.addEventListener('load', start);
</script>
</body>
</html>
